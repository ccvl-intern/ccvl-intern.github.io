name: Recover stalled Pages deployment

on:
  push:
    branches: [ops/pages-recovery-20261105]
    paths: [.github/workflows/recover-pages.yml]

permissions:
  contents: read
  pages: write
  actions: write

concurrency:
  group: pages-recovery-20261105
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Cancel the stale deployment and retry only the failed publish job
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          const repo = process.env.GITHUB_REPOSITORY;
          const stale = 'de6c3962c168a12a992f079ca42ca294cbe5da9a';
          const expectedMain = 'd56cf154e1f6efbc6efc09991878c857da2a51b3';
          if (repo !== 'ccvl-intern/ccvl-intern.github.io') throw new Error('Unexpected repository');

          async function api(path, method = 'GET', accepted = [200]) {
            const response = await fetch(`https://api.github.com/repos/${repo}/${path}`, {
              method,
              headers: {
                Authorization: `Bearer ${process.env.GH_TOKEN}`,
                Accept: 'application/vnd.github+json',
                'X-GitHub-Api-Version': '2026-03-10'
              },
              redirect: 'error',
              signal: AbortSignal.timeout(20000)
            });
            const text = await response.text();
            if (!accepted.includes(response.status)) throw new Error(`${method} ${path}: ${response.status} ${text}`);
            return {status: response.status, data: text ? JSON.parse(text) : null};
          }

          const main = (await api('branches/main')).data;
          const run = (await api('actions/runs/41932874935')).data;
          const job = (await api('actions/jobs/126934034242')).data;
          if (main.commit.sha !== expectedMain || run.head_sha !== expectedMain ||
              run.head_branch !== 'main' || run.conclusion !== 'failure' ||
              job.run_id !== run.id || job.name !== 'deploy' || job.conclusion !== 'failure') {
            throw new Error('Frozen recovery target changed; refusing to cancel or retry another deployment');
          }

          const path = `pages/deployments/${stale}`;
          const terminal = new Set(['succeed', 'failed', 'cancelled', 'canceled', 'deployment_failed', 'deployment_cancelled', 'deployment_canceled']);
          let state = await api(path);
          console.log(`Stale Pages deployment: ${state.data.status}`);
          if (!terminal.has(state.data.status)) {
            await api(`${path}/cancel`, 'POST', [204]);
            console.log('Cancellation accepted for the exact stale deployment');
            for (let attempt = 0; attempt < 24; attempt++) {
              await new Promise(resolve => setTimeout(resolve, 5000));
              state = await api(path, 'GET', [200, 404]);
              console.log(`Cancellation check: ${state.data?.status || state.status}`);
              if (state.status === 404 || terminal.has(state.data.status)) break;
            }
            if (state.status !== 404 && !terminal.has(state.data.status)) throw new Error('Pages cancellation has not completed');
          }

          await api('actions/jobs/126934034242/rerun', 'POST', [201]);
          console.log('Retry accepted for the failed publish job; successful build and site files are unchanged');
          JS
