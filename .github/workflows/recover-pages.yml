name: Configure explicit Pages publication

on:
  push:
    branches: [ops/pages-recovery-20261105]
    paths: [.github/workflows/recover-pages.yml]

permissions:
  contents: read
  pages: write
  actions: write

concurrency:
  group: pages-recovery-20261105
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Stop stalled retry and enable official static-site workflow publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          const repo = process.env.GITHUB_REPOSITORY;
          const stale = 'de6c3962c168a12a992f079ca42ca294cbe5da9a';
          if (repo !== 'ccvl-intern/ccvl-intern.github.io') throw new Error('Unexpected repository');

          async function api(path, method = 'GET', accepted = [200], body) {
            const response = await fetch(`https://api.github.com/repos/${repo}/${path}`, {
              method,
              headers: {
                Authorization: `Bearer ${process.env.GH_TOKEN}`,
                Accept: 'application/vnd.github+json',
                'Content-Type': 'application/json',
                'X-GitHub-Api-Version': '2026-03-10'
              },
              body: body === undefined ? undefined : JSON.stringify(body),
              redirect: 'error',
              signal: AbortSignal.timeout(20000)
            });
            const text = await response.text();
            if (!accepted.includes(response.status)) throw new Error(`${method} ${path}: ${response.status} ${text}`);
            return {status: response.status, data: text ? JSON.parse(text) : null};
          }

          const site = (await api('pages')).data;
          console.log(`::notice::Pages configuration: ${JSON.stringify({status:site.status,build_type:site.build_type,source:site.source,html_url:site.html_url})}`);
          if (site.source.branch !== 'main' || site.source.path !== '/' || site.build_type !== 'legacy') {
            throw new Error('Unexpected Pages source; refusing to alter settings');
          }
          const run = (await api('actions/runs/41931272054')).data;
          if (run.head_sha !== stale || run.run_attempt !== 2) throw new Error('Unexpected retry target');
          if (run.status !== 'completed') {
            await api('actions/runs/41931272054/cancel', 'POST', [202]);
            console.log('::notice::Cancellation accepted for this stalled retry only');
          }
          await api('pages', 'PUT', [204], {build_type:'workflow'});
          const updated = (await api('pages')).data;
          if (updated.build_type !== 'workflow' || updated.html_url !== site.html_url || updated.cname !== site.cname) throw new Error('Pages settings verification failed');
          console.log(`::notice::Explicit workflow publication enabled; URL and custom domain unchanged: ${updated.html_url}`);
          JS
