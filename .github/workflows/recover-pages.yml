name: Inspect Pages recovery blocker

on:
  push:
    branches: [ops/pages-recovery-20261105]
    paths: [.github/workflows/recover-pages.yml]

permissions:
  contents: read
  pages: read
  actions: read

concurrency:
  group: pages-recovery-20261105
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Inspect configuration failure without changing Pages or workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          const repo = process.env.GITHUB_REPOSITORY;
          const stale = 'de6c3962c168a12a992f079ca42ca294cbe5da9a';
          if (repo !== 'ccvl-intern/ccvl-intern.github.io') throw new Error('Unexpected repository');

          async function api(path, method = 'GET', accepted = [200], body) {
            const response = await fetch(`https://api.github.com/repos/${repo}/${path}`, {
              method,
              headers: {
                Authorization: `Bearer ${process.env.GH_TOKEN}`,
                Accept: 'application/vnd.github+json',
                'Content-Type': 'application/json',
                'X-GitHub-Api-Version': '2026-03-10'
              },
              body: body === undefined ? undefined : JSON.stringify(body),
              redirect: 'error',
              signal: AbortSignal.timeout(20000)
            });
            const text = await response.text();
            if (!accepted.includes(response.status)) throw new Error(`${method} ${path}: ${response.status} ${text}`);
            return {status: response.status, data: text ? JSON.parse(text) : null};
          }

          const site = (await api('pages')).data;
          console.log(`::notice::Pages configuration: ${JSON.stringify({status:site.status,build_type:site.build_type,source:site.source,html_url:site.html_url})}`);
          const response = await fetch(`https://api.github.com/repos/${repo}/actions/jobs/126942740020/logs`, {
            headers: {Authorization:`Bearer ${process.env.GH_TOKEN}`, Accept:'application/vnd.github+json'},
            redirect:'manual', signal:AbortSignal.timeout(20000)
          });
          if (response.status !== 302) throw new Error(`Log download status ${response.status}`);
          const downloadUrl = response.headers.get('location');
          if (new URL(downloadUrl).protocol !== 'https:') throw new Error('Non-HTTPS log URL');
          const download = await fetch(downloadUrl, {signal:AbortSignal.timeout(20000)});
          if (!download.ok) throw new Error(`Log body status ${download.status}`);
          const lines = (await download.text()).split('\n');
          const error = lines.find(line => /Error: PUT pages:/.test(line));
          console.log(`::notice::Configuration API result: ${error || 'Expected configuration error line not found'}`);
          JS
