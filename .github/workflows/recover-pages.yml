name: Recover stalled Pages deployment

on:
  push:
    branches: [ops/pages-recovery-20261105]
    paths: [.github/workflows/recover-pages.yml]

permissions:
  contents: read
  pages: write
  actions: write
  deployments: write

concurrency:
  group: pages-recovery-20261105
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Clear the backed-up failed deployment record and retry publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          const repo = process.env.GITHUB_REPOSITORY;
          const stale = 'de6c3962c168a12a992f079ca42ca294cbe5da9a';
          const expectedMain = 'd56cf154e1f6efbc6efc09991878c857da2a51b3';
          if (repo !== 'ccvl-intern/ccvl-intern.github.io') throw new Error('Unexpected repository');

          async function api(path, method = 'GET', accepted = [200], body) {
            const response = await fetch(`https://api.github.com/repos/${repo}/${path}`, {
              method,
              headers: {
                Authorization: `Bearer ${process.env.GH_TOKEN}`,
                Accept: 'application/vnd.github+json',
                'Content-Type': 'application/json',
                'X-GitHub-Api-Version': '2026-03-10'
              },
              body: body === undefined ? undefined : JSON.stringify(body),
              redirect: 'error',
              signal: AbortSignal.timeout(20000)
            });
            const text = await response.text();
            if (!accepted.includes(response.status)) throw new Error(`${method} ${path}: ${response.status} ${text}`);
            return {status: response.status, data: text ? JSON.parse(text) : null};
          }

          const main = (await api('branches/main')).data;
          const run = (await api('actions/runs/41932874935')).data;
          const job = (await api('actions/jobs/126938555562')).data;
          if (main.commit.sha !== expectedMain || run.head_sha !== expectedMain ||
              run.head_branch !== 'main' || run.conclusion !== 'failure' ||
              job.run_id !== run.id || job.name !== 'deploy' || job.conclusion !== 'failure') {
            throw new Error('Frozen recovery target changed; refusing to cancel or retry another deployment');
          }

          const path = 'deployments/7560318951';
          const deployment = (await api(path)).data;
          const statuses = (await api(`${path}/statuses`)).data;
          const state = (await api(`pages/deployments/${stale}`)).data;
          if (deployment.sha !== stale || deployment.environment !== 'github-pages' ||
              statuses[0]?.state !== 'failure' || state.status !== 'deployment_cancelled') {
            throw new Error('Refusing to remove a deployment that is not the verified failed/cancelled record');
          }
          console.log(`::notice::Verified failed record ${deployment.id} at ${deployment.sha}; backup retained locally`);
          await api(`${path}/statuses`, 'POST', [201], {
            state: 'inactive',
            description: 'Cancelled Pages deployment: removing stale record after backup to unblock publication',
            auto_inactive: false
          });
          await api(path, 'DELETE', [204]);
          console.log('::notice::Removed only failed deployment record 7560318951; successful deployment and Pages site retained');

          await api('actions/jobs/126938555562/rerun', 'POST', [201]);
          console.log('::notice::Retry accepted for the failed publish job; successful build and site files are unchanged');
          JS
