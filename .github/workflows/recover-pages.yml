name: Recover stalled Pages deployment

on:
  push:
    branches: [ops/pages-recovery-20261105]
    paths: [.github/workflows/recover-pages.yml]

permissions:
  contents: read
  pages: write
  actions: write

concurrency:
  group: pages-recovery-20261105
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Republish the original frozen artifact with identical site content
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          const repo = process.env.GITHUB_REPOSITORY;
          const stale = 'de6c3962c168a12a992f079ca42ca294cbe5da9a';
          const expectedMain = 'd56cf154e1f6efbc6efc09991878c857da2a51b3';
          if (repo !== 'ccvl-intern/ccvl-intern.github.io') throw new Error('Unexpected repository');

          async function api(path, method = 'GET', accepted = [200], body) {
            const response = await fetch(`https://api.github.com/repos/${repo}/${path}`, {
              method,
              headers: {
                Authorization: `Bearer ${process.env.GH_TOKEN}`,
                Accept: 'application/vnd.github+json',
                'Content-Type': 'application/json',
                'X-GitHub-Api-Version': '2026-03-10'
              },
              body: body === undefined ? undefined : JSON.stringify(body),
              redirect: 'error',
              signal: AbortSignal.timeout(20000)
            });
            const text = await response.text();
            if (!accepted.includes(response.status)) throw new Error(`${method} ${path}: ${response.status} ${text}`);
            return {status: response.status, data: text ? JSON.parse(text) : null};
          }

          const main = (await api('branches/main')).data;
          const run = (await api('actions/runs/41931272054')).data;
          const job = (await api('actions/jobs/126928569590')).data;
          const originalCommit = (await api(`git/commits/${stale}`)).data;
          const currentCommit = (await api(`git/commits/${expectedMain}`)).data;
          if (main.commit.sha !== expectedMain || run.head_sha !== stale ||
              run.head_branch !== 'main' || run.conclusion !== 'failure' ||
              originalCommit.tree.sha !== currentCommit.tree.sha ||
              job.run_id !== run.id || job.name !== 'deploy' || job.conclusion !== 'failure') {
            throw new Error('Frozen recovery target changed; refusing to cancel or retry another deployment');
          }

          console.log(`::notice::Original and current commits have identical tree ${originalCommit.tree.sha}`);
          await api('actions/jobs/126928569590/rerun', 'POST', [201]);
          console.log('::notice::Retry accepted for the original artifact; no source or build changes');
          JS
