      <section class="section shell" id="results">
        <div class="section-intro"><h2>Full-cohort evaluation.</h2><p>One frozen protocol. All 13 studies. The earlier task-conditioned graph is evaluated separately from the development methods above.</p></div>
        <div class="protocol-line"><span>Qwen3.5-27B</span><span>490 questions / 188 declared sources</span><span>Single-run evaluation</span></div>
        <div class="tabs" role="tablist" aria-label="Full-cohort result view">
          <button id="tab-cohort" role="tab" aria-selected="true" aria-controls="panel-cohort">Per study</button>
          <button id="tab-aggregate" role="tab" aria-selected="false" aria-controls="panel-aggregate" tabindex="-1">Matched aggregate</button>
        </div>
        <div id="panel-cohort" role="tabpanel" aria-labelledby="tab-cohort">
          <div class="result-heading"><div><p class="small-label">Table 2</p><h3>Reasoning across the complete study inventory</h3></div><label class="search-label">Study<input id="study-search" type="search" placeholder="Search study" aria-label="Search full-cohort studies"></label></div>
          <div class="table-scroll" role="region" aria-label="Frozen full-cohort results by study" tabindex="0"><table class="result-table cohort-table"><thead><tr><th scope="col">Study</th><th scope="col">Questions</th><th scope="col">Video</th><th scope="col">Direct code</th><th scope="col">Full code</th><th scope="col">Task graph</th><th scope="col">Partial reference</th></tr></thead><tbody id="cohort-table"></tbody></table></div>
          <p id="cohort-count" class="caption" role="status"></p>
          <p class="caption">R&sup2; (%) averages primary experiments within each study. Stephan includes 28 primary + 2 diagnostic questions; Beller 2025 has one diagnostic question only. Undefined values remain missing, never zero. Partial reference is incomplete GT-derived evidence, not an Oracle upper bound.</p>
        </div>
        <div id="panel-aggregate" role="tabpanel" aria-labelledby="tab-aggregate" hidden>
          <div class="result-heading"><div><p class="small-label">Table 3</p><h3>Matched complete-and-defined diagnostic</h3></div><span class="small-label">410 questions / 15 experiments</span></div>
          <div class="table-scroll" role="region" aria-label="Matched aggregate results" tabindex="0"><table class="result-table"><thead><tr><th scope="col">Condition</th><th scope="col">R&sup2; (%)</th><th scope="col">Signed r</th><th scope="col">nRMSE</th></tr></thead><tbody id="aggregate-table"></tbody></table></div>
          <p class="caption">This is the common defined subset, not the full 490-question score. The graph's signed correlation is below both code controls. The apparent R&sup2; advantage is not stable across scoring protocols.</p>
        </div>
        <aside class="research-note"><strong>The full-cohort goal remains open.</strong><p>All five strict fixed-22-experiment aggregates are undefined. Incomplete outputs, constant predictions and insufficient type-level samples are retained as evaluation limitations, not removed to manufacture an overall score.</p></aside>
        <details class="paper-details"><summary>Metric definition, coverage &amp; reproducibility</summary><div class="prose">
          <p>We report squared Pearson correlation with human item means. Within each experiment, response-type R&sup2; values are equally averaged, followed by equal experiment averaging. This follows the paper-style aggregation with disclosed local edge rules, not a full replication of the official ten-run protocol.</p>
          <p>The local rule requires at least three scalar points per type, nonzero variance and complete predictions. Undefined types propagate. The released CogGym evaluator instead uses normalized pooled correlation; its denominator and estimator differ. Negative correlation can still produce high R&sup2;, so signed r and nRMSE accompany aggregate and development results.</p>
          <p>The full cohort retains 24 experiments: 22 primary (487 questions), plus two diagnostic experiments (3 questions). Direct code was generated by Qwen3-VL-8B-Instruct; the final reasoner is Qwen3.5-27B, FP16, non-thinking, greedy.</p>
          <p><a id="cohort-source" href="data/research-20261105.json">Source-linked evaluation record</a> &middot; <a href="https://coggym.org/">CogGym</a></p>
        </div></details>
      </section>

          <div class="table-scroll" role="region" aria-label="Computational cost" tabindex="0"><table class="result-table cost-table"><thead><tr><th scope="col">Stage / experiment</th><th scope="col">Workload</th><th scope="col">Hardware</th><th scope="col">Throughput</th><th scope="col">Timing scope</th></tr></thead><tbody>

          <div class="section-intro"><h2>What the experiments tell us.</h2></div>
          <div class="discussion-grid">
            <article><span class="small-label">Evidence quality</span><h3>Geometry is not dynamics.</h3><p>High box overlap does not validate identity continuity, contact timing, velocity or latent physical properties. Partial reference graphs are not complete physical Oracles.</p></article>
            <article><span class="small-label">Evidence interface</span><h3>Meaning must be explicit.</h3><p>Bass improves when event occurrence is separated from finite-horizon absence. The same physical facts can be misunderstood when their semantics are compressed.</p></article>
            <article><span class="small-label">Reasoning &amp; transfer</span><h3>A local gain is not a general solution.</h3><p>Numerical timelines help selected conditional tasks; other studies still expose scale-polarity errors, unsupported assumptions and weak calibration.</p></article>
