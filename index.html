      <section class="section shell" id="method">
        <div class="section-intro">
          <h2>More than a scene description.</h2>
          <p>Accurate geometry does not automatically produce accurate physical judgments. We study how parsed objects, motion and relations become evidence a vision-language model can actually use.</p>
        </div>
        <ol class="method-flow">
          <li><span>01 / Perceive</span><h3>Parse Anything</h3><p>Identify objects; estimate masks, geometry and trajectories.</p></li>
          <li><span>02 / Organize</span><h3>Task-conditioned graph</h3><p>Bind identities, coordinates, time and question-relevant relations.</p></li>
          <li><span>03 / Compute</span><h3>Bounded operations</h3><p>Calculate supported events, paths or geometry under explicit assumptions.</p></li>
          <li><span>04 / Communicate</span><h3>Readable evidence</h3><p>Separate observations, modeled outcomes and unknown states.</p></li>
          <li><span>05 / Reason</span><h3>VLM judgment</h3><p>Answer from the original video, question and supplied evidence.</p></li>
        </ol>
        <p class="caption"><b>Figure 1.</b> The current research direction. The completed development methods below use different operations; a single transferable pipeline is not yet validated.</p>
        <details class="paper-details">
          <summary>Parsing architecture &amp; earlier adaptive abstraction</summary>
          <figure><img src="assets/figures/parse-anything.png" loading="lazy" alt="Parse Anything: identification, masks, geometry, tracking, sampling and lifting into object-centric code" width="1280" height="400"><figcaption>Parse Anything combines a VLM identifier, SAM3.1, VGGT-&Omega; and SpatialTrackerV2.</figcaption></figure>
          <figure><img src="assets/figures/adaptive-abstraction.png" loading="lazy" alt="Earlier adaptive abstraction: iterative selection by confidence, length, importance and relevance"><figcaption>Earlier adaptive abstraction selects and derives code iteratively. The newer study-specific experiments add explicit evidence semantics and task operations.</figcaption></figure>
        </details>
      </section>

      <section class="section shell" id="results">

        <div id="panel-aggregate" role="tabpanel" aria-labelledby="tab-aggregate" hidden>
          <div class="result-heading"><div><p class="small-label">Table 3</p><h3>Matched complete-and-defined diagnostic</h3></div><span class="small-label">410 questions / 15 experiments</span></div>
          <div class="table-scroll" role="region" aria-label="Matched aggregate results" tabindex="0"><table class="result-table"><thead><tr><th scope="col">Condition</th><th scope="col">R&sup2; (%)</th><th scope="col">Signed r</th><th scope="col">nRMSE</th></tr></thead><tbody id="aggregate-table"></tbody></table></div>
          <p class="caption">This is the common defined subset, not the full 490-question score. The graph's signed correlation is below both code controls. The apparent R&sup2; advantage is not stable across scoring protocols.</p>
        </div>
        <aside class="research-note"><strong>The full-cohort goal remains open.</strong><p>All five strict fixed-22-experiment aggregates are undefined. Incomplete outputs, constant predictions and insufficient type-level samples are retained as evaluation limitations, not removed to manufacture an overall score.</p></aside>
        <details class="paper-details"><summary>Metric definition, coverage &amp; reproducibility</summary><div class="prose">
          <p>We report squared Pearson correlation with human item means. Within each experiment, response-type R&sup2; values are equally averaged, followed by equal experiment averaging. This follows the paper-style aggregation with disclosed local edge rules, not a full replication of the official ten-run protocol.</p>
          <p>The local rule requires at least three scalar points per type, nonzero variance and complete predictions. Undefined types propagate. The released CogGym evaluator instead uses normalized pooled correlation; its denominator and estimator differ. Negative correlation can still produce high R&sup2;, so signed r and nRMSE accompany aggregate and development results.</p>
          <p>The full cohort retains 24 experiments: 22 primary (487 questions), plus two diagnostic experiments (3 questions). Direct code was generated by Qwen3-VL-8B-Instruct; the final reasoner is Qwen3.5-27B, FP16, non-thinking, greedy.</p>
          <p><a id="cohort-source" href="data/research-20261105.json">Source-linked evaluation record</a> &middot; <a href="https://coggym.org/">CogGym</a></p>
        </div></details>

      <section class="section section-tint" id="parsing">
        <div class="shell">
          <div class="section-intro"><h2>Parsing is not the whole story.</h2><p>The original geometry benchmark measures reconstruction quality. Reasoning also requires temporal accuracy, valid physical assumptions and correct use of the evidence.</p></div>
          <div class="parsing-strip"><div><strong>84.14 <small>&plusmn; 10.88%</small></strong><span>mIoU / 280 samples / accepted-box merge</span></div><div><strong>7.26 <small>&plusmn; 11.43%</small></strong><span>Center RPE@1 / 130 temporal samples / 8B-Thinking</span></div></div>
          <details class="paper-details"><summary>Table 4. Archived parsing comparison</summary><div class="table-scroll" role="region" aria-label="Parsing comparison" tabindex="0"><table class="result-table"><thead><tr><th scope="col">Parser</th><th scope="col">mIoU (%)</th><th scope="col">Center RPE@1 (%)</th></tr></thead><tbody id="parsing-table"></tbody></table></div><p class="caption">Mean &plusmn; population SD across samples (ddof = 0), not seed uncertainty. Center RPE is displacement residual normalized by the source-frame diagonal. Parse Anything mIoU uses the accepted-box merge; temporal RPE uses a separate 8B-Thinking condition. These do not validate the dynamics of every reasoning question.</p></details>
          <div class="result-heading"><div><p class="small-label">Table 5</p><h3>Computational cost</h3></div></div>
          <div class="table-scroll" role="region" aria-label="Computational cost" tabindex="0"><table class="result-table cost-table"><thead><tr><th scope="col">Stage / experiment</th><th scope="col">Workload</th><th scope="col">Hardware</th><th scope="col">Throughput</th><th scope="col">Timing scope</th></tr></thead><tbody>
            <tr><th scope="row">Parse Anything<small>Archived parsing run</small></th><td>280 samples<br>4,439 sampled frames</td><td>4 independent<br>1&times; A5000 workers</td><td><b>0.3250</b> sampled images/s/GPU</td><td>13,657.11 summed worker seconds; includes loading and pipeline</td></tr>
            <tr><th scope="row">Explicit event semantics<small>Bass development</small></th><td>84 new VQA calls</td><td>4&times; A5000</td><td><b>0.00579</b> requests/s/GPU*</td><td>3,628 s allocation; includes model startup</td></tr>
            <tr><th scope="row">Agentic refinement<small>Hamrick pilot</small></th><td>10 videos</td><td>1&times; A5000</td><td><b>0.00252</b> videos/s/GPU</td><td>396.8 s/video, including post-freeze evaluation</td></tr>
          </tbody></table></div>
          <p class="caption">*Allocation-normalized multi-GPU throughput, not a measured single-card inference rate. Images, VQA requests and videos are different work units. Parsing timing uses an 8B-Instruct identifier, not a jointly measured configuration with the accuracy figures above.</p>
          <details class="paper-details"><summary>Agentic refinement: a small gain at substantial cost</summary><p class="prose">A target-blind Qwen3-VL-8B-Thinking refinement loop improved Hamrick 3D-box mIoU from <b>59.86 &plusmn; 12.48%</b> to <b>61.87 &plusmn; 7.01%</b>. Refinement took 65 min 56 s; post-freeze evaluation took 12 s. This 10-video parsing pilot is separate from the current reasoning experiments.</p></details>
        </div>

      <section class="section section-rule" id="discussion">
        <div class="shell">
          <div class="section-intro"><h2>What the experiments tell us.</h2></div>
          <div class="discussion-grid">
            <article><span class="small-label">Evidence quality</span><h3>Geometry is not dynamics.</h3><p>High box overlap does not validate identity continuity, contact timing, velocity or latent physical properties. Partial reference graphs are not complete physical Oracles.</p></article>
            <article><span class="small-label">Evidence interface</span><h3>Meaning must be explicit.</h3><p>Bass improves when event occurrence is separated from finite-horizon absence. The same physical facts can be misunderstood when their semantics are compressed.</p></article>
            <article><span class="small-label">Reasoning &amp; transfer</span><h3>A local gain is not a general solution.</h3><p>Numerical timelines help selected conditional tasks; other studies still expose scale-polarity errors, unsupported assumptions and weak calibration.</p></article>
          </div>
          <div class="progress-note"><div><p class="small-label">Research snapshot / 5 November 2026</p><h3>One shared interface. The next test.</h3></div><p>Bass (42 questions) and Gerstenberg 2021 (8 questions) are prepared for a unified 50-question comparison. At this snapshot, GPU inference is queued: <b>0 / 74 new requests completed</b>. No unified-method score is reported.</p></div>
        </div>
